[project]
name = "runstate-tui"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "runstate",
    "textual>=8.2.8",
]

[project.scripts]
runstate-tui = "runstate_tui.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy", "pytest-cov", "cairosvg"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["runstate_tui"]

[tool.uv.sources]
# PINNED to a commit, the 0.4.0 release (log format 0.4.0) that GeoffChurch/mycooc and
# GeoffChurch/translation are migrating to: the cockpit reads their logs, and on 0.4.0 it refuses
# every older-format log (LogFormatMismatch / LogFormatMissing), so its pin must move with theirs.
runstate = { git = "https://github.com/GeoffChurch/runstate", rev = "4fa40b5212af76937a26d43542795705a55043d6" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["runstate_tui"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=runstate_tui --cov-report=term-missing"

[tool.coverage.run]
source = ["runstate_tui"]
branch = true

[dependency-groups]
dev = [
    "pytest-textual-snapshot>=1.1.0",
]
